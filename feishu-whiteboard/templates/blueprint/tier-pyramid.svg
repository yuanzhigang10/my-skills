<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Noto Sans SC, -apple-system, sans-serif">
  <rect width="1200" height="760" fill="#fafbfc"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">指标体系金字塔 · 输入 → 过程 → 结果</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#6b7280">下层埋点支撑上层度量 · 上层结果反推下层质量 · 8 个指标三层组合</text>

  <!-- Legend -->
  <g transform="translate(40,90)">
    <rect width="14" height="14" fill="#a855f7"/>
    <text x="22" y="12" font-size="11" fill="#374151">结果层 · 给老板看</text>
    <rect x="160" width="14" height="14" fill="#10b981"/>
    <text x="182" y="12" font-size="11" fill="#374151">过程层 · 给 owner 调质量</text>
    <rect x="370" width="14" height="14" fill="#3b82f6"/>
    <text x="392" y="12" font-size="11" fill="#374151">输入层 · 给 SRE 接埋点</text>
  </g>

  <!-- ============ Tier 1 (TOP) · 结果指标 (purple, narrow trapezoid) ============ -->
  <polygon points="380,140 820,140 820,222 320,222" fill="#a855f7" opacity="0.92"/>
  <polygon points="380,140 820,140 820,222 320,222" fill="none" stroke="#6b21a8" stroke-width="2"/>
  <text x="600" y="170" text-anchor="middle" font-size="11" fill="#fde68a" letter-spacing="2" font-weight="600">TIER 1 · 结果指标 · OUTCOME</text>
  <text x="600" y="194" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">老板看的数字 · 决定项目继续 / 加投 / 收尾</text>
  <text x="600" y="212" text-anchor="middle" font-size="11" fill="#f3e8ff">2 项 · P2 · 季度更新 · 需要前两层数据稳定后才能算</text>

  <!-- 2 metric chips for tier 1 -->
  <g transform="translate(420,232)">
    <rect width="170" height="44" rx="6" fill="#fff" stroke="#6b21a8"/>
    <text x="14" y="20" font-size="11" font-weight="600" fill="#6b21a8" font-family="JetBrains Mono, monospace">node:metric.outcome</text>
    <text x="14" y="34" font-size="11" fill="#1f2937">节省人日 ≥ 30%</text>
  </g>
  <g transform="translate(610,232)">
    <rect width="170" height="44" rx="6" fill="#fff" stroke="#6b21a8"/>
    <text x="14" y="20" font-size="11" font-weight="600" fill="#6b21a8" font-family="JetBrains Mono, monospace">node:metric.recall_at_k</text>
    <text x="14" y="34" font-size="11" fill="#1f2937">离线 recall@K ≥ 80%</text>
  </g>

  <!-- Up-arrow indicating feed -->
  <line x1="600" y1="296" x2="600" y2="316" stroke="#6b7280" stroke-width="2"/>
  <polygon points="594,302 600,290 606,302" fill="#6b7280"/>
  <text x="612" y="310" font-size="10" fill="#6b7280" font-style="italic">feeds outcome</text>

  <!-- ============ Tier 2 (MIDDLE) · 过程指标 (green, wider trapezoid) ============ -->
  <polygon points="280,322 920,322 980,420 220,420" fill="#10b981" opacity="0.92"/>
  <polygon points="280,322 920,322 980,420 220,420" fill="none" stroke="#065f46" stroke-width="2"/>
  <text x="600" y="354" text-anchor="middle" font-size="11" fill="#fef3c7" letter-spacing="2" font-weight="600">TIER 2 · 过程指标 · PROCESS</text>
  <text x="600" y="378" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">Skill owner 用来调质量的中层指标</text>
  <text x="600" y="396" text-anchor="middle" font-size="11" fill="#d1fae5">4 项 · P0 + P1 · W3 起每周更新 · 反映 description 写得好不好 / 流程顺不顺</text>

  <!-- 4 metric chips for tier 2 -->
  <g transform="translate(240,430)">
    <rect width="170" height="44" rx="6" fill="#fff" stroke="#065f46"/>
    <text x="14" y="20" font-size="11" font-weight="600" fill="#065f46" font-family="JetBrains Mono, monospace">recall.coarse</text>
    <text x="14" y="34" font-size="11" fill="#1f2937">召回率（粗）≥ 30%</text>
  </g>
  <g transform="translate(424,430)">
    <rect width="170" height="44" rx="6" fill="#fff" stroke="#065f46"/>
    <text x="14" y="20" font-size="11" font-weight="600" fill="#065f46" font-family="JetBrains Mono, monospace">completion_rate</text>
    <text x="14" y="34" font-size="11" fill="#1f2937">完成率 ≥ 90%</text>
  </g>
  <g transform="translate(608,430)">
    <rect width="170" height="44" rx="6" fill="#fff" stroke="#065f46"/>
    <text x="14" y="20" font-size="11" font-weight="600" fill="#065f46" font-family="JetBrains Mono, monospace">latency.p50</text>
    <text x="14" y="34" font-size="11" fill="#1f2937">平均耗时 P50 &lt; 30s</text>
  </g>
  <g transform="translate(792,430)">
    <rect width="170" height="44" rx="6" fill="#fff" stroke="#065f46"/>
    <text x="14" y="20" font-size="11" font-weight="600" fill="#065f46" font-family="JetBrains Mono, monospace">error_rate</text>
    <text x="14" y="34" font-size="11" fill="#1f2937">出错率 &lt; 5%</text>
  </g>

  <!-- Up-arrow indicating feed -->
  <line x1="600" y1="494" x2="600" y2="514" stroke="#6b7280" stroke-width="2"/>
  <polygon points="594,500 600,488 606,500" fill="#6b7280"/>
  <text x="612" y="508" font-size="10" fill="#6b7280" font-style="italic">computed from</text>

  <!-- ============ Tier 3 (BOTTOM) · 输入指标 (blue, widest trapezoid) ============ -->
  <polygon points="180,520 1020,520 1080,620 120,620" fill="#3b82f6" opacity="0.92"/>
  <polygon points="180,520 1020,520 1080,620 120,620" fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="600" y="552" text-anchor="middle" font-size="11" fill="#fef3c7" letter-spacing="2" font-weight="600">TIER 3 · 输入指标 · INPUT (raw events)</text>
  <text x="600" y="576" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">SRE 埋点产出 · 一切的根</text>
  <text x="600" y="594" text-anchor="middle" font-size="11" fill="#dbeafe">3 项 · P0 · W1 起实时上报 · 没这层就没数据</text>

  <!-- 3 metric chips for tier 3 -->
  <g transform="translate(220,630)">
    <rect width="200" height="44" rx="6" fill="#fff" stroke="#1e40af"/>
    <text x="14" y="20" font-size="11" font-weight="600" fill="#1e40af" font-family="JetBrains Mono, monospace">event:skill.load</text>
    <text x="14" y="34" font-size="11" fill="#1f2937">加载次数 (SessionStart hook)</text>
  </g>
  <g transform="translate(498,630)">
    <rect width="200" height="44" rx="6" fill="#fff" stroke="#1e40af"/>
    <text x="14" y="20" font-size="11" font-weight="600" fill="#1e40af" font-family="JetBrains Mono, monospace">event:skill.invoke</text>
    <text x="14" y="34" font-size="11" fill="#1f2937">调用次数 (PreToolUse hook)</text>
  </g>
  <g transform="translate(776,630)">
    <rect width="200" height="44" rx="6" fill="#fff" stroke="#1e40af"/>
    <text x="14" y="20" font-size="11" font-weight="600" fill="#1e40af" font-family="JetBrains Mono, monospace">event:skill.complete</text>
    <text x="14" y="34" font-size="11" fill="#1f2937">完成事件 (PostToolUse hook)</text>
  </g>

  <!-- Side annotations -->
  <g transform="translate(40,260)">
    <text x="0" y="0" font-size="10" font-weight="600" fill="#6b21a8" letter-spacing="1.5">↑ 决策侧</text>
    <text x="0" y="14" font-size="9.5" fill="#6b7280">@boss</text>
    <text x="0" y="26" font-size="9.5" fill="#6b7280">@stakeholder</text>
  </g>

  <g transform="translate(40,376)">
    <text x="0" y="0" font-size="10" font-weight="600" fill="#065f46" letter-spacing="1.5">↑ 调优侧</text>
    <text x="0" y="14" font-size="9.5" fill="#6b7280">@skill owner</text>
    <text x="0" y="26" font-size="9.5" fill="#6b7280">@analyst</text>
  </g>

  <g transform="translate(40,572)">
    <text x="0" y="0" font-size="10" font-weight="600" fill="#1e40af" letter-spacing="1.5">↑ 埋点侧</text>
    <text x="0" y="14" font-size="9.5" fill="#6b7280">@SRE</text>
    <text x="0" y="26" font-size="9.5" fill="#6b7280">@infra</text>
  </g>

  <!-- Right side: 数据通道 -->
  <g transform="translate(1110,140)">
    <rect width="60" height="480" rx="6" fill="#1f2937"/>
    <text x="30" y="38" text-anchor="middle" font-size="10" fill="#94a3b8" letter-spacing="1.5">数据</text>
    <text x="30" y="58" text-anchor="middle" font-size="10" fill="#94a3b8" letter-spacing="1.5">通道</text>
    <text x="30" y="100" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">A</text>
    <text x="30" y="124" text-anchor="middle" font-size="10" fill="#94a3b8">Aeolus</text>
    <text x="30" y="138" text-anchor="middle" font-size="9" fill="#64748b">实时</text>
    <line x1="14" y1="160" x2="46" y2="160" stroke="#94a3b8" stroke-width="1"/>
    <text x="30" y="200" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">jsonl</text>
    <text x="30" y="220" text-anchor="middle" font-size="10" fill="#94a3b8">本地缓冲</text>
    <text x="30" y="234" text-anchor="middle" font-size="9" fill="#64748b">cron up</text>
    <line x1="14" y1="256" x2="46" y2="256" stroke="#94a3b8" stroke-width="1"/>
    <text x="30" y="296" text-anchor="middle" font-size="20" fill="#fff" font-weight="700">batch</text>
    <text x="30" y="316" text-anchor="middle" font-size="10" fill="#94a3b8">离线评测</text>
    <text x="30" y="330" text-anchor="middle" font-size="9" fill="#64748b">季度跑</text>
    <line x1="14" y1="352" x2="46" y2="352" stroke="#94a3b8" stroke-width="1"/>
    <text x="30" y="392" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">SQL</text>
    <text x="30" y="412" text-anchor="middle" font-size="10" fill="#94a3b8">git stat</text>
    <text x="30" y="426" text-anchor="middle" font-size="9" fill="#64748b">人日估算</text>
  </g>

  <!-- Footer summary -->
  <line x1="40" y1="694" x2="1160" y2="694" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="40" y="722" font-size="11" font-weight="600" fill="#1f2937">三层指标如何相互验证</text>
  <text x="40" y="740" font-size="10" fill="#374151">输入层突增但调用率不涨 → description 写错了　·　完成率高但耗时长 → skill 内 tool 链路低效　·　召回率高但人日没省 → 用户在用但价值有限</text>
  <text x="40" y="754" font-size="9.5" fill="#6b7280" font-style="italic">关键定律：三层任何一层数据失真，上层结论都不可信 · 必须从最底层埋点开始建立信任链</text>
</svg>
